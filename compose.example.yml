services:
  keelhaularr:
    build: .
    container_name: keelhaularr
    restart: unless-stopped
    env_file: .env
    # QBITTORRENT_URL must be reachable from this container. Add both services
    # to the same Docker network when using a name such as http://qbittorrent:8080.
    # Automatic recovery is a separate, destructive opt-in. It stays off unless
    # QBITTORRENT_RECOVERY_ENABLED=true is set in .env or enabled in Settings.
    ports:
      - "8787:8787"
    volumes:
      # GUI-managed settings are stored here and survive image updates.
      - ./config:/config
      # Use the same container paths reported by Radarr and Sonarr where possible.
      - /path/on/server/movies:/movies
      - /path/on/server/tv:/tv
      # Use separate completed folders for each app. Do not mount incomplete downloads.
      - /path/on/server/torrents/movies:/radarr-downloads
      - /path/on/server/torrents/tv:/sonarr-downloads
      - /path/on/server/keelhaularr-quarantine:/quarantine
